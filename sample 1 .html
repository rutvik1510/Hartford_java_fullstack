<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friends Farmhouse</title>
</head>
<body>

    <header>
        <h1>Friends Farmhouse</h1>
        <p style ="font-size:10; "><b>“Good times + Crazy friends = Great memories”</b></p>
    </header>
    <img src="FARMHOUSE IMG.jpg" alt="farmhouse" height= "auto" width="20%">
    <nav>
        <a href="#">Home</a> |
        <a href="#">Booking</a> |
        <a href="#">Contact</a>
    </nav>

    <article>
        <h2>Booking Form</h2>

        <form>
            <label>Name:</label><br>
            <input type="text" placeholder="Full Name" required><br><br>

            <label>Email:</label><br>
            <input type="email" required><br><br>

            <label>Phone:</label><br>
            <input type="tel" placeholder="Enter 10-digit number" required><br><br>

            <label>Gender:</label><br>
            <select required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
            </select><br><br>

            <label>Check-in Date:</label><br>
            <input type="date" required><br><br>

            <label>Check-out Date:</label><br>
            <input type="date" required><br><br>

            <label>Guests:</label><br>
            <input type="number" min="3" max="12" placeholder="3 to 12 guests" required><br><br>

            <input type="submit" value="Book Now">
        </form>

        <br>

        <!-- WhatsApp + Email Buttons -->
        <a href="https://wa.me/919999999999"
           target="_blank"
           style="display:inline-block;
                  padding:10px 15px;
                  background-color:#25D366;
                  color:white;
                  text-decoration:none;
                  border-radius:5px;
                  margin-right:10px;">
           Send to WhatsApp
        </a>

        <a href="mailto:friendsfarmhouse@gmail.com"
           style="display:inline-block;
                  padding:10px 15px;
                  background-color:#0072c6;
                  color:white;
                  text-decoration:none;
                  border-radius:5px;">
           Send to Email
        </a>

        <br><br>

        <!-- Simple Map -->
        <h3>Our Location</h3>

        <iframe
            src="https://www.google.com/maps?q=Hyderabad&output=embed"
            width="100%"
            height="300"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>

    </article>

    <aside>
        <h3>Note</h3>
        <p>Carry valid ID proof at check-in.</p>
    </aside>

    <footer>
        <p>&copy; 2026 Friends Farmhouse. All rights reserved.</p>
    </footer>

</body>
</html>
