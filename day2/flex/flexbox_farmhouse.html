<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Friends Union Farmhouse</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;

    
    background: linear-gradient(
      to bottom right,
      #eaf6ff,
      #327531
    );
  }

  .container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    text-align: center;
    background: #004aad;
    color: white;
    padding: 15px;
    border-radius: 10px;
  }

  header p {
    font-size: 12px;
    color: #e0ecff;
  }

  .image-box {
    display: flex;
    justify-content: center;
  }

  img {
    width: 200px;
    border-radius: 10px;
    border: 3px solid #004aad;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    background: #ffffff;
    padding: 10px;
    border-radius: 8px;
  }

  nav a {
    text-decoration: none;
    color: #004aad;
    font-weight: bold;
  }

  nav a:hover {
    color: #e63946;
  }

  .content {
    display: flex;
    gap: 20px;
  }

  article {
    flex: 3;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    border-left: 6px solid #004aad;
  }

  article h2 {
    color: #004aad;
  }

  aside {
    flex: 1;
    background: #f0f7ff;
    padding: 20px;
    border-radius: 10px;
    border-left: 6px solid #e63946;
  }

  aside h3 {
    color: #e63946;
  }

  label {
    color: #333;
    font-weight: bold;
  }

  form input,
  form select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  input[type="submit"] {
    background: #004aad;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
  }

  input[type="submit"]:hover {
    background: #00337f;
  }

  footer {
    text-align: center;
    background: #004aad;
    color: white;
    padding: 10px;
    border-radius: 8px;
  }

  @media (max-width: 768px) {
    .content {
      flex-direction: column;
    }

    nav {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Friends Union Farmhouse</h1>
    <p><b>Good times + Crazy friends = Great memories</b></p>
  </header>

  <div class="image-box">
    <img src="FARMHOUSE IMG.jpg" alt="farmhouse">
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Booking</a>
    <a href="#">Contact</a>
  </nav>

  <div class="content">

    <article>
      <h2>Booking Form</h2>

      <form>
        <label>Name:</label>
        <input type="text" placeholder="Full Name" required>

        <label>Email:</label>
        <input type="email" required>

        <label>Phone:</label>
        <input type="tel" placeholder="Enter 10-digit number" required>

        <label>Gender:</label>
        <select required>
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
        </select>

        <label>Check-in Date:</label>
        <input type="date" required>

        <label>Check-out Date:</label>
        <input type="date" required>

        <label>Guests:</label>
        <input type="number" min="3" max="12" placeholder="3 to 12 guests" required>

        <br><br>
        <input type="submit" value="Book Now">
      </form>

      <br>

      <a href="https://wa.me/919999999999"
         target="_blank"
         style="padding:10px 15px;
                background:#25D366;
                color:white;
                text-decoration:none;
                border-radius:5px;
                margin-right:10px;">
        Send to WhatsApp
      </a>

      <a href="mailto:friendsfarmhouse@gmail.com"
         style="padding:10px 15px;
                background:#0072c6;
                color:white;
                text-decoration:none;
                border-radius:5px;">
        Send to Email
      </a>

      <h3 style="color:#004aad;">Our Location</h3>

      <iframe
        src="https://www.google.com/maps?q=Hyderabad&output=embed"
        width="100%"
        height="250"
        style="border:0;border-radius:8px;"
        loading="lazy">
      </iframe>
    </article>

    <aside>
      <h3>Note</h3>
      <p>Carry valid ID proof at check-in.</p>
    </aside>

  </div>

  <footer>
    <p>&copy; 2026 Friends Farmhouse. All rights reserved.</p>
  </footer>

</div>

</body>
</html>
